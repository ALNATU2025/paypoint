name: Build APK

on:
  push:
    branches: [main, build-apk]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/paypoint-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/paypoint-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/paypoint-armeabi-v7a.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: paypoint-apk
          path: dist/*.apk
          retention-days: 30
