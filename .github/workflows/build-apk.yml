name: Build APK

on:
  push:
    branches: [main, build-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare log folder
        run: mkdir -p ci-logs && flutter --version | tee ci-logs/flutter-version.txt

      - run: flutter pub get 2>&1 | tee ci-logs/pub-get.txt

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-logs/analyze.txt

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ci-logs/test.txt

      - name: Build release APKs
        id: build
        run: |
          set -o pipefail
          {
            flutter build apk --release
            flutter build apk --release --split-per-abi
          } 2>&1 | tee ci-logs/build.txt

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/paypoint-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/paypoint-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/paypoint-armeabi-v7a.apk
          ls -lh dist | tee ci-logs/apks.txt

      - uses: actions/upload-artifact@v4
        with:
          name: paypoint-apk
          path: dist/*.apk
          retention-days: 30

      # A single rolling pre-release with the newest APKs, easy to open on a phone.
      - name: Publish "Latest APK" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk dist/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Paypoint APK (latest build)" \
            --notes "Built automatically from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Most phones: install paypoint-arm64-v8a.apk. If unsure, use paypoint-universal.apk."

      # Store the plain-text logs on a ci-logs branch so they can be read
      # through the GitHub API.
      - name: Publish logs
        if: always()
        run: |
          echo "analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}" > ci-logs/summary.txt
          cd ci-logs
          git init -q
          git config user.name "paypoint-ci"
          git config user.email "paypoint-ci@users.noreply.github.com"
          git checkout -q -b ci-logs
          git add -A
          git commit -q -m "CI logs for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
